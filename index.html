<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121321" />
    <meta
      name="description"
      content="Bear Together — a tiny online cabin for two. 两个人的在线小屋：一起养熊、聊天、下井字棋。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BB%3C/text%3E%3C/svg%3E"
    />
    <title>Bear Together · 一起养只熊</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #0c0d17;
        color: #fff8ec;
        font-family: 'Avenir Next', 'Nunito', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      #root:empty::before {
        content: '';
        display: block;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
      }
      .boot-bear {
        font-size: 58px;
        animation: boot-bob 2.4s ease-in-out infinite;
      }
      .boot-text {
        font-size: 14px;
        letter-spacing: 0.05em;
        opacity: 0.82;
      }
      .boot-sub {
        font-size: 11px;
        opacity: 0.5;
        letter-spacing: 0.08em;
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bear { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-bear" aria-hidden="true">🐻</div>
        <div class="boot-text">正在唤醒小屋…</div>
        <div class="boot-sub">Bear Together</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
